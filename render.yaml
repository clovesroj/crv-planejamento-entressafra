# Blueprint do Render: cria o web service e o Postgres já conectados.
# No painel: New > Blueprint > aponte para este repositório.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: crv-planejamento-db
    databaseName: crv_planejamento
    user: crv
    plan: free
    postgresMajorVersion: "16"
    region: ohio

services:
  - type: web
    name: crv-planejamento-entressafra
    runtime: node
    plan: free
    region: ohio          # precisa ser a mesma do banco para usar a rede interna
    buildCommand: npm install && npx playwright install --with-deps chromium
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: crv-planejamento-db
          property: connectionString

